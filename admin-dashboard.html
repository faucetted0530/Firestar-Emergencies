<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin Dashboard | Firestar Emergencies</title>

  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

  <div class="dashboard-container">

    <!-- Sidebar -->
    <aside class="sidebar">

      <div class="logo">
        <h2>FIRESTAR</h2>
        <span>Emergency Dispatch</span>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="active">Dashboard</a>
        <a href="#">Incidents</a>
        <a href="#">Units</a>
        <a href="#">Responders</a>
        <a href="#">Reports</a>
        <a href="#">Settings</a>
      </nav>

      <button id="logoutBtn" class="logout-btn">
        Logout
      </button>

    </aside>

    <!-- Main Content -->
    <main class="main-content">

      <!-- Top Bar -->
      <header class="topbar">

        <div>
          <h1>Admin Dashboard</h1>
          <p>Emergency operations overview</p>
        </div>

        <div class="admin-profile">

          <div class="avatar">
            A
          </div>

          <div>
            <h3 id="adminName">Admin</h3>
            <span>Dispatcher</span>
          </div>

        </div>

      </header>

      <!-- Stats -->
      <section class="stats-grid">

        <div class="stat-card">
          <h2 id="activeIncidentCount">0</h2>
          <p>Active Incidents</p>
        </div>

        <div class="stat-card">
          <h2 id="highPriorityCount">0</h2>
          <p>High Priority Incidents</p>
        </div>

      </section>

      <!-- Incident Creation -->
      <section class="panel">

        <div class="panel-header">
          <h2>Create Incident</h2>
        </div>

        <form class="dispatch-form" id="dispatchForm">

          <input
            type="text"
            id="incidentTitle"
            placeholder="Incident Title"
            required
          />

          <input
            type="text"
            id="incidentLocation"
            placeholder="Location"
            required
          />

          <input
            type="email"
            id="customerEmail"
            placeholder="Customer Email"
            required
          />

          <select id="incidentPriority" required>
            <option value="">Priority Level</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
            <option value="Critical">Critical</option>
          </select>

          <textarea
            id="incidentDetails"
            placeholder="Incident Details"
            required
          ></textarea>

          <button type="submit">
            Create Incident
          </button>

        </form>

      </section>

      <!-- Incident Feed -->
      <section class="panel">

        <div class="panel-header">
          <h2>Active Incidents</h2>
        </div>

        <div class="incident-list">

          <!-- Dynamic incidents load here -->

        </div>

      </section>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/supabase.js"></script>
  <script src="js/dashboard.js"></script>

</body>
</html>
