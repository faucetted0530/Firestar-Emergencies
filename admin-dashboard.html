<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Operations Hub | Firestar Emergencies</title>

  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

  <div class="dashboard-container">

    <aside class="sidebar">
      <div class="logo">
        <h2>FIRESTAR</h2>
        <span>Operations Hub</span>
      </div>

      <nav class="sidebar-nav">
        <a href="admin-dashboard.html" class="active">Operations Hub</a>
      </nav>

      <button id="logoutBtn" class="logout-btn">Logout</button>
    </aside>

    <main class="main-content">

      <header class="topbar">
        <div>
          <h1>Operations Hub</h1>
          <p>Create incidents, assign responders, and manage emergency activity.</p>
        </div>

        <div class="admin-profile">
          <div class="avatar">A</div>

          <div>
            <h3 id="adminName">Admin</h3>
            <span>Administrator</span>
          </div>
        </div>
      </header>

      <section class="stats-grid">
        <div class="stat-card">
          <h2 id="activeIncidentCount">0</h2>
          <p>Active Incidents</p>
        </div>

        <div class="stat-card">
          <h2 id="highPriorityCount">0</h2>
          <p>High Priority Incidents</p>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Create Incident</h2>
        </div>

        <form class="dispatch-form" id="dispatchForm">
          <input type="text" id="incidentTitle" placeholder="Incident Title" required />

          <input type="text" id="incidentLocation" placeholder="Location" required />

          <input type="email" id="customerEmail" placeholder="Customer Email" required />

          <select id="incidentPriority" required>
            <option value="">Priority Level</option>
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
            <option value="Critical">Critical</option>
          </select>

          <textarea id="incidentDetails" placeholder="Incident Details" required></textarea>

          <button type="submit">Create Incident</button>
        </form>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Assign Responders</h2>
        </div>

        <form class="dispatch-form" id="assignResponderForm">
          <select id="incidentSelect" required>
            <option value="">Select Incident</option>
          </select>

          <select id="responderType" required>
            <option value="">Responder Type</option>
            <option value="Firefighters">Firefighters</option>
            <option value="Police">Police</option>
            <option value="EMS">EMS</option>
            <option value="SWAT">SWAT</option>
            <option value="Rescue Team">Rescue Team</option>
            <option value="Hazmat">Hazmat</option>
          </select>

          <input
            type="text"
            id="assignedUnit"
            placeholder="Assigned Unit Example: Engine 12, Medic 4, Patrol 8"
            required
          />

          <select id="responderStatus" required>
            <option value="">Responder Status</option>
            <option value="Pending Dispatch">Pending Dispatch</option>
            <option value="Dispatched">Dispatched</option>
            <option value="En Route">En Route</option>
            <option value="On Scene">On Scene</option>
            <option value="Resolved">Resolved</option>
          </select>

          <button type="submit">Assign Responders</button>

          <p class="form-message" id="dispatchMessage"></p>
        </form>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Active Incidents</h2>
        </div>

        <div class="incident-list">
          <!-- Incidents load here -->
        </div>
      </section>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/dashboard.js"></script>

</body>
</html>
