<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Dispatch Dashboard | Firestar Emergencies</title>

  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

  <div class="dashboard-container">

    <aside class="sidebar">
      <div class="logo">
        <h2>FIRESTAR</h2>
        <span>Dispatch Center</span>
      </div>

      <nav class="sidebar-nav">
        <a href="admin-dashboard.html">Admin</a>
        <a href="dispatch-dashboard.html" class="active">Dispatch</a>
        <a href="#">Incidents</a>
        <a href="#">Responders</a>
      </nav>

      <button id="logoutBtn" class="logout-btn">Logout</button>
    </aside>

    <main class="main-content">

      <header class="topbar">
        <div>
          <h1>Dispatch Dashboard</h1>
          <p>Assign responders to active incidents</p>
        </div>

        <div class="admin-profile">
          <div class="avatar">D</div>
          <div>
            <h3 id="dispatcherName">Dispatcher</h3>
            <span>Operations</span>
          </div>
        </div>
      </header>

      <section class="panel">
        <div class="panel-header">
          <h2>Assign Responders</h2>
        </div>

        <form class="dispatch-form" id="assignResponderForm">

          <select id="incidentSelect" required>
            <option value="">Select Incident</option>
          </select>

          <select id="responderType" required>
            <option value="">Responder Type</option>
            <option value="Firefighters">Firefighters</option>
            <option value="Police">Police</option>
            <option value="EMS">EMS</option>
            <option value="SWAT">SWAT</option>
            <option value="Rescue Team">Rescue Team</option>
            <option value="Hazmat">Hazmat</option>
          </select>

          <input
            type="text"
            id="assignedUnit"
            placeholder="Assigned Unit Example: Engine 12, Medic 4, Patrol 8"
            required
          />

          <select id="responderStatus" required>
            <option value="">Responder Status</option>
            <option value="Pending Dispatch">Pending Dispatch</option>
            <option value="Dispatched">Dispatched</option>
            <option value="En Route">En Route</option>
            <option value="On Scene">On Scene</option>
            <option value="Resolved">Resolved</option>
          </select>

          <button type="submit">Assign Responders</button>

          <p class="form-message" id="dispatchMessage"></p>

        </form>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Current Incidents</h2>
        </div>

        <div class="incident-list" id="dispatchIncidentList">
          <!-- Incidents load here -->
        </div>
      </section>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/dispatch.js"></script>

</body>
</html>
