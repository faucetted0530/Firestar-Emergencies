<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sign In | Firestar Emergencies</title>

  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <main class="auth-page">
    <section class="auth-visual">
      <div class="badge">FIRESTAR EMERGENCIES</div>

      <h1>Welcome back, responder.</h1>

      <p>
        Sign in to continue managing emergency operations and incident data.
      </p>
    </section>

    <section class="auth-card">
      <h2>Sign In</h2>

      <p class="subtitle">Access your dashboard</p>

      <form id="signinForm">
        <input
          type="email"
          id="signinEmail"
          placeholder="Email Address"
          required
        />

        <input
          type="password"
          id="signinPassword"
          placeholder="Password"
          required
        />

        <div class="form-message" id="formMessage"></div>

        <button type="submit">Sign In</button>
      </form>

      <div class="auth-links">
        <p class="switch-text">
          Don’t have an account?
          <a href="signup.html">Create Account</a>
        </p>

        <p class="switch-text admin-link">
          Need administrator access?
          <a href="admin-signup.html">Admin Sign Up</a>
        </p>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
